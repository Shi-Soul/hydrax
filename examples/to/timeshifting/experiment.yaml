backend: jax
task: double_cart_pole
algorithms: [cbo, cem]
modes: [legacy, reset, shift]
seeds: [0, 1, 2]
video_seed: 0
domain_seed: 0
warmup_seed: 999
samples: 1024
iterations: 4
selected_parameters: examples/to/selected_parameters.yaml
output_dir: examples/to/results/double_cart_pole_timeshifting

shift_steps:
  one_step: 1
  short: 5
  long: 25

task_config:
  segment_horizon: 1.0
  total_horizon: 10.0
  randomizations: 1
  knots: 6
  spline: cubic
  base_noise: 0.3
  temperature: 0.1

render:
  width: 640
  height: 400
  fps: 24

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
