backend: jax
task: double_cart_pole
algorithm: cbo
seed: 0
domain_seed: 0
warmup_seed: 999
samples: 1024
iterations: 8
execution_fraction: 0.5
selected_parameters: examples/to/selected_parameters.yaml
output_path: examples/to/results/double_cart_pole_single.json

task_config:
  segment_horizon: 1.0
  total_horizon: 10.0
  randomizations: 1
  knots: 6
  spline: cubic
  base_noise: 0.3
  temperature: 0.1

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
