backend: jax
action: benchmark
output_dir: examples/to/results
selected_parameters: examples/to/selected_parameters.yaml
domain_seed: 0
warmup_seed: 999
evaluation_seeds: [0, 1, 2, 3, 4]
execution_fraction: 0.5

tasks_to_run:
  - cart_pole
  - double_cart_pole
  - humanoid_standup
  - pusht
  - bugtrap

algorithms_to_run:
  - cbo
  - mppi_cma
  - cmaes
  - cem
  - ps
  - dial

render:
  width: 640
  height: 400
  fps: 24

tasks:
  cart_pole:
    iterations: 10
    segment_horizon: 1.0
    total_horizon: 2.0
    samples: 128
    randomizations: 1
    knots: 4
    spline: cubic
    base_noise: 0.3
    temperature: 0.1
  double_cart_pole:
    iterations: 10
    segment_horizon: 1.0
    total_horizon: 8.0
    samples: 1024
    randomizations: 1
    knots: 4
    spline: cubic
    base_noise: 0.3
    temperature: 0.1
  humanoid_standup:
    iterations: 5
    segment_horizon: 0.6
    total_horizon: 10.0
    samples: 128
    randomizations: 4
    knots: 4
    spline: zero
    base_noise: 0.3
    temperature: 0.1
  pusht:
    iterations: 10
    segment_horizon: 0.5
    total_horizon: 5.0
    samples: 128
    randomizations: 4
    knots: 6
    spline: zero
    base_noise: 0.4
    temperature: 0.01
  bugtrap:
    iterations: 20
    segment_horizon: 1.0
    total_horizon: 10.0
    samples: 32
    randomizations: 1
    knots: 11
    spline: zero
    base_noise: 1.0
    temperature: 0.01

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
